[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oneclick-project"
version = "2.2.0"
description = "Create a new, consistently named project folder from a template, in one click."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.scripts]
oneclick = "oneclick.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oneclick = ["builtin_templates/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
